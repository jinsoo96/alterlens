<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07040f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ALTERLENS" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
    <title>ALTERLENS</title>
  </head>
  <body>
    <canvas id="view"></canvas>
    <video id="cam" playsinline muted autoplay></video>

    <header id="top">
      <div class="meta"><span id="fps">-- FPS</span><span id="ai">AI --</span></div>
      <div class="toggles">
        <button id="t-mod" aria-label="얼굴 개조 바꾸기">MOD</button>
        <button id="t-fx" aria-label="입자 효과">FX</button>
        <button id="t-glitch" aria-label="글리치">GLITCH</button>
        <button id="t-hud" aria-label="HUD">HUD</button>
      </div>
    </header>

    <footer id="bottom">
      <nav id="themes" hidden></nav>
      <nav id="styles"></nav>
      <div class="controls">
        <div class="side">
          <button id="gallery" class="round" aria-label="사진 불러오기">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" /><circle cx="9" cy="10" r="2" /><path d="M21 16l-5-5-9 9" /></svg>
          </button>
          <button id="snap-btn" class="round" aria-label="폰 기본 카메라로 찍기">
            <svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z" /><circle cx="12" cy="13" r="3.5" /></svg>
          </button>
        </div>
        <button id="shutter" aria-label="촬영"><span></span></button>
        <div class="side end">
          <button id="flip" class="round" aria-label="카메라 전환">
            <svg viewBox="0 0 24 24"><path d="M4 9h11l-3-3M20 15H9l3 3" /></svg>
          </button>
        </div>
      </div>
    </footer>

    <div id="splash">
      <div class="logo">ALTER<b>//</b>LENS</div>
      <p class="tag">카메라에 비친 거리와 사람을<br />실시간으로 다른 세계관으로 바꿔 보는 렌즈</p>
      <button id="start" class="primary">카메라 시작</button>
      <button id="start-snap" class="ghost">폰 카메라로 찍기</button>
      <button id="start-photo" class="ghost">갤러리 사진으로</button>
      <p id="splash-msg"></p>
      <p class="fine">모든 처리는 이 기기 안에서만 이뤄지고, 사진은 어디로도 전송되지 않습니다.</p>
    </div>

    <div id="preview" hidden>
      <img id="preview-img" alt="촬영 결과" />
      <div class="ai-row">
        <div id="steps"></div>
        <button id="ai-btn" class="ai" hidden>✦ 테마 그림으로 바꾸기</button>
        <form id="chat" hidden>
          <input id="chat-input" maxlength="300" placeholder="어떻게 바꿀까요? 예) 머리를 길게, 비 오는 밤으로" autocomplete="off" />
          <button type="submit" aria-label="보내기">↑</button>
        </form>
        <p id="ai-msg"></p>
      </div>
      <div class="actions">
        <button id="close" class="ghost">다시 찍기</button>
        <button id="share" class="ghost">공유</button>
        <button id="save" class="primary">저장</button>
      </div>
    </div>

    <pre id="debug" hidden></pre>

    <input type="file" id="file" accept="image/*" hidden />
    <!-- capture: 폰 기본 카메라 앱을 열고, 찍은 사진을 받아 테마를 입힌다 -->
    <input type="file" id="snap" accept="image/*" capture="environment" hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
