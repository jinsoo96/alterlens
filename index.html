<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07040f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NEON LENS" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
    <title>NEON LENS</title>
  </head>
  <body>
    <canvas id="view"></canvas>
    <video id="cam" playsinline muted autoplay></video>

    <header id="top">
      <div class="meta"><span id="fps">-- FPS</span><span id="ai">AI --</span></div>
      <div class="toggles">
        <button id="t-mod" aria-label="얼굴 개조 바꾸기">MOD</button>
        <button id="t-rain" aria-label="비">RAIN</button>
        <button id="t-glitch" aria-label="글리치">GLITCH</button>
        <button id="t-hud" aria-label="HUD">HUD</button>
      </div>
    </header>

    <footer id="bottom">
      <nav id="styles"></nav>
      <div class="controls">
        <button id="gallery" class="round" aria-label="사진 불러오기">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" /><circle cx="9" cy="10" r="2" /><path d="M21 16l-5-5-9 9" /></svg>
        </button>
        <button id="shutter" aria-label="촬영"><span></span></button>
        <button id="flip" class="round" aria-label="카메라 전환">
          <svg viewBox="0 0 24 24"><path d="M4 9h11l-3-3M20 15H9l3 3" /></svg>
        </button>
      </div>
    </footer>

    <div id="splash">
      <div class="logo">NEON<b>//</b>LENS</div>
      <p class="tag">카메라를 켜는 순간, 거리는 네온 도시가 되고<br />사람은 사이버펑크 캐릭터가 됩니다.</p>
      <button id="start" class="primary">카메라 시작</button>
      <button id="start-photo" class="ghost">사진으로 해보기</button>
      <p id="splash-msg"></p>
      <p class="fine">모든 처리는 이 기기 안에서만 이뤄지고, 사진은 어디로도 전송되지 않습니다.</p>
    </div>

    <div id="preview" hidden>
      <img id="preview-img" alt="촬영 결과" />
      <div class="actions">
        <button id="close" class="ghost">다시 찍기</button>
        <button id="share" class="ghost">공유</button>
        <button id="save" class="primary">저장</button>
      </div>
    </div>

    <input type="file" id="file" accept="image/*" hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
